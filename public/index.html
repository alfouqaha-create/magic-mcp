<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>درجاتي</title>
<style>
  :root { --bg:#f4f6fb; --card:#fff; --main:#2f5bea; --main-soft:#eef2ff; --text:#1d2433; --muted:#6b7280; --line:#e5e7eb; --bad:#b91c1c; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Tahoma, Arial, sans-serif; background:var(--bg); color:var(--text); }
  header { background:var(--main); color:#fff; padding:22px 16px; text-align:center; }
  header h1 { margin:0; font-size:22px; }
  header p { margin:6px 0 0; opacity:.85; font-size:14px; }
  main { max-width:720px; margin:20px auto; padding:0 16px 40px; }
  .card { background:var(--card); border-radius:12px; padding:18px; margin-bottom:16px; box-shadow:0 2px 8px rgba(0,0,0,.06); }
  label { display:block; margin-bottom:8px; font-weight:bold; }
  .row { display:flex; gap:10px; }
  input { flex:1; min-width:0; padding:12px; border:1px solid #d1d5db; border-radius:8px; font-size:17px; letter-spacing:1px; }
  button { padding:12px 18px; border:0; border-radius:8px; background:var(--main); color:#fff; font-size:16px; cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  button.link { background:none; color:var(--main); padding:6px 0; font-size:14px; }
  .tabs { display:flex; gap:6px; margin-bottom:16px; background:var(--main-soft); padding:4px; border-radius:10px; }
  .tab { flex:1; background:none; color:var(--main); padding:9px; font-size:15px; }
  .tab.on { background:var(--main); color:#fff; }
  .field { margin-bottom:12px; }
  .field input { width:100%; }
  button.wide { width:100%; }
  .hint { color:var(--muted); font-size:13px; margin:10px 0 0; }
  #err { display:none; margin-top:12px; background:#fee2e2; color:var(--bad); padding:10px; border-radius:8px; }
  .hello { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:14px; }
  .hello h2 { margin:0; font-size:19px; }
  .hello small { color:var(--muted); }
  .course h3 { margin:0 0 2px; font-size:18px; }
  .course .meta { color:var(--muted); font-size:13px; margin-bottom:14px; }
  .tiles { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:16px; }
  .tile { background:var(--main-soft); border-radius:10px; padding:12px 6px; text-align:center; }
  .tile span { display:block; font-size:12px; color:var(--muted); min-height:30px; }
  .tile b { font-size:24px; }
  .tile b i { font-style:normal; font-size:13px; color:var(--muted); font-weight:normal; }
  .tile.none b { color:var(--muted); font-size:18px; }
  table { width:100%; border-collapse:collapse; }
  th, td { padding:9px 8px; border-bottom:1px solid var(--line); font-size:14px; text-align:start; }
  td.v { text-align:center; white-space:nowrap; width:90px; }
  tr.g td { background:#f8f9fc; font-weight:bold; }
  tr.i td:first-child { padding-inline-start:20px; }
  .dash { color:var(--muted); }
  footer { text-align:center; font-size:12px; color:var(--muted); margin-top:24px; }
  footer a { color:var(--muted); }
  @media (max-width:420px){ .tile b{font-size:20px} th,td{padding:8px 4px} }
</style>
</head>
<body>
<header>
  <h1>📚 درجاتي</h1>
  <p>اعرض نتائج التقويم التكويني في مقرراتك</p>
</header>
<main>
  <section class="card" id="loginCard">
    <div class="tabs" role="tablist">
      <button type="button" class="tab on" id="tabLogin" role="tab">دخول</button>
      <button type="button" class="tab" id="tabReg" role="tab">حساب جديد</button>
    </div>
    <form id="form">
      <div class="field">
        <label for="aid">الرقم الأكاديمي</label>
        <input id="aid" inputmode="numeric" autocomplete="username" placeholder="مثال: 20260106" required maxlength="12">
      </div>
      <div class="field" id="nameField" hidden>
        <label for="nm">اسمك الثلاثي (كما في كشف الدرجات)</label>
        <input id="nm" autocomplete="off" placeholder="الاسم الأول + الأب + الجد" maxlength="100">
      </div>
      <div class="field">
        <label for="pw" id="pwLabel">كلمة السر</label>
        <input type="password" id="pw" autocomplete="current-password" required maxlength="72">
      </div>
      <div class="field" id="pw2Field" hidden>
        <label for="pw2">تأكيد كلمة السر</label>
        <input type="password" id="pw2" autocomplete="new-password" maxlength="72">
      </div>
      <button type="submit" id="go" class="wide">دخول</button>
      <p class="hint" id="hint" hidden>تنشئ الحساب مرة واحدة فقط، ثم تدخل برقمك الأكاديمي وكلمة السر التي اخترتها.</p>
      <div id="err" role="alert"></div>
    </form>
  </section>

  <section id="result" hidden></section>

  <footer>للاستفسار عن أي درجة راجع معلم المقرر. <a href="/teacher">دخول المعلم</a></footer>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, txt) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (txt !== undefined) n.textContent = txt;
    return n;
  };
  const fmt = (n) => (Number.isInteger(n) ? String(n) : n.toFixed(1));

  function setErr(msg) {
    $("err").textContent = msg || "";
    $("err").style.display = msg ? "block" : "none";
  }

  function tile(label, value, max) {
    const t = el("div", "tile" + (value == null ? " none" : ""));
    t.append(el("span", "", label));
    const b = el("b");
    if (value == null) b.textContent = "لم تُرصد بعد";
    else { b.append(document.createTextNode(fmt(value) + " ")); b.append(el("i", "", "/ " + max)); }
    t.append(b);
    return t;
  }

  function valueCell(value, max, cls) {
    const td = el("td", "v " + (cls || ""));
    if (value == null) td.append(el("span", "dash", "— / " + max));
    else td.textContent = fmt(value) + " / " + max;
    return td;
  }

  function courseCard(c) {
    const card = el("section", "card course");
    card.append(el("h3", "", c.code + " — الشعبة " + c.section));
    card.append(el("div", "meta", [c.teacher && "المعلم: " + c.teacher, c.semester].filter(Boolean).join(" · ")));

    const tiles = el("div", "tiles");
    tiles.append(tile("المجموع الكلي", c.total, c.totalMax));
    tiles.append(tile("درجة التقويم التكويني", c.formative, c.formativeMax));
    tiles.append(tile("الامتحان النهائي (العملي)", c.final, c.finalMax));
    card.append(tiles);

    const table = el("table");
    const tb = el("tbody");
    c.groups.forEach((g) => {
      const gr = el("tr", "g");
      gr.append(el("td", "", g.label), valueCell(g.total, g.max));
      tb.append(gr);
      g.items.forEach((i) => {
        const r = el("tr", "i");
        r.append(el("td", "", i.label), valueCell(i.value, i.max));
        tb.append(r);
      });
    });
    table.append(tb);
    card.append(table);
    return card;
  }

  function show(data) {
    const box = $("result");
    box.replaceChildren();
    const hello = el("div", "hello");
    const who = el("div");
    who.append(el("h2", "", data.name), el("small", "", "الرقم الأكاديمي: " + data.academic_id));
    const back = el("button", "link", "بحث برقم آخر");
    back.onclick = reset;
    hello.append(who, back);
    box.append(hello);
    data.courses.forEach((c) => box.append(courseCard(c)));
    box.hidden = false;
    $("loginCard").hidden = true;
    window.scrollTo(0, 0);
  }

  let mode = "login";
  function setMode(m) {
    mode = m;
    const reg = m === "register";
    $("tabLogin").classList.toggle("on", !reg);
    $("tabReg").classList.toggle("on", reg);
    $("nameField").hidden = !reg;
    $("pw2Field").hidden = !reg;
    $("hint").hidden = !reg;
    $("nm").required = reg;
    $("pw2").required = reg;
    $("pwLabel").textContent = reg ? "اختر كلمة سر (6 أحرف على الأقل)" : "كلمة السر";
    $("pw").autocomplete = reg ? "new-password" : "current-password";
    $("go").textContent = reg ? "إنشاء الحساب وعرض درجاتي" : "دخول";
    setErr("");
  }
  $("tabLogin").onclick = () => setMode("login");
  $("tabReg").onclick = () => setMode("register");

  function reset() {
    $("result").hidden = true;
    $("result").replaceChildren();
    $("loginCard").hidden = false;
    ["aid", "nm", "pw", "pw2"].forEach((id) => { $(id).value = ""; });
    setMode("login");
    $("aid").focus();
  }

  $("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    setErr("");
    if (mode === "register") {
      if ($("pw").value.length < 6) return setErr("كلمة السر يجب ألا تقل عن 6 أحرف");
      if ($("pw").value !== $("pw2").value) return setErr("كلمتا السر غير متطابقتين");
    }
    $("go").disabled = true;
    try {
      const body = { academic_id: $("aid").value, password: $("pw").value };
      if (mode === "register") body.name = $("nm").value;
      const res = await fetch("/api/student/" + (mode === "register" ? "register" : "login"), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || "حدث خطأ، حاول مرة أخرى");
      ["nm", "pw", "pw2"].forEach((id) => { $(id).value = ""; });
      show(data);
    } catch (err) {
      setErr(err.message);
    } finally {
      $("go").disabled = false;
    }
  });
</script>
</body>
</html>
